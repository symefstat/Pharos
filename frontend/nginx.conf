# nginx config for the Pharos SPA container.
#
# This reproduces, locally, exactly what App Platform's HTTP router does in prod
# (see .do/app.yaml): /api/* goes to the FastAPI service, everything else is the
# static SPA. Both arrive on one origin, so the browser makes same-origin
# requests and CORS never enters the picture — the same reason vite.config.ts
# proxies /api during `npm run dev`.
#
# Getting this wrong locally is how CORS bugs reach production unnoticed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── the API, proxied to the sibling container ────────────────────────────
    # "api" is the Compose service name; Docker's embedded DNS resolves it to
    # that container's address on the shared network. Not localhost — in
    # Compose each service is its own network namespace, so 127.0.0.1 here
    # would mean nginx itself.
    location /api/ {
        proxy_pass http://api:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Toqan-backed endpoints (Ask, the news refreshers) call an external
        # agent and can genuinely take a while. nginx's 60s default would return
        # 504 mid-answer, which reads as a backend bug when it is really a proxy
        # timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── hashed build assets ─────────────────────────────────────────────────
    # Vite fingerprints these filenames (index-a1b2c3d4.js), so the content at a
    # given URL never changes and a year-long immutable cache is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # react-router owns the client-side routes, so a hard refresh on /capital
    # must return index.html rather than 404 — the App Platform equivalent is
    # `catchall_document: index.html`.
    #
    # index.html itself must NOT be cached: it carries the <script> tags naming
    # the current hashed bundles, so a stale copy points at assets that no
    # longer exist and the app loads to a blank screen after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
