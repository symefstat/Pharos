name: CI

# Quality gate on every push to main and every PR: byte-compile, run the test
# suite, and smoke the eval harness against the example gold set. No secrets and
# no live calls — the real eval-vs-gold (--from-supabase) is a local/manual step
# that runs once backend/eval/gold_labels.jsonl is labelled.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 1) Byte-compile the tracked source (mirrors the local py_compile gate).
      - name: Compile
        run: python -m compileall -q backend tests

      # 2) Full test suite (pure logic + headless render checks).
      - name: Tests
        run: python -m pytest -q

      # 3) Eval-harness smoke: validate the example gold, then score the fixture.
      #    Proves the harness imports and scores end-to-end without a DB.
      - name: Eval smoke
        run: |
          python backend/eval_run.py --gold backend/eval/gold_labels.example.jsonl --validate-gold
          python backend/eval_run.py --gold backend/eval/gold_labels.example.jsonl --from-fixture backend/eval/predictions.fixture.jsonl
