name: Refresh feeds + analytics

# Refresh all feeds, classify with the MOT lens, then rebuild the rollup and the
# Strategist read — every 6 hours. Add these repository secrets before enabling
# (Settings → Secrets and variables → Actions):
#   Feeds:      TOQAN_HOME_PAGE_NEWS, TOQAN_AI_ENERGY_NEWS, TOQAN_DISRUPTIVE_TECH,
#               TOQAN_CHIPS_NEWS, TOQAN_GEOPOLITICS_NEWS, TOQAN_CLIMATE_NEWS,
#               TOQAN_BIOTECH_NEWS, TOQAN_SOFTWARE_NEWS, TOQAN_FINTECH_NEWS,
#               TOQAN_DEFENSE_NEWS
#   Analytics:  TOQAN_MOT_LENS, TOQAN_STRATEGIST
#   Embeddings: OPENAI_API_KEY            (Strategist theory retrieval)
#   Database:   SUPABASE_URL, SUPABASE_KEY (service-role)
#   Optional:   TOQAN_API_URL            (defaults to https://api.toqan.ai)

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab

# A slow Toqan spell can push a run toward the 45-min timeout; without this a
# manual dispatch (or the next cron tick) would overlap it. Writes are
# idempotent upserts so overlap corrupts nothing — it just doubles agent spend.
concurrency:
  group: home-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Every step shares these. Missing optional secrets are simply empty.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TOQAN_API_URL: ${{ secrets.TOQAN_API_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TOQAN_HOME_PAGE_NEWS: ${{ secrets.TOQAN_HOME_PAGE_NEWS }}
      TOQAN_AI_ENERGY_NEWS: ${{ secrets.TOQAN_AI_ENERGY_NEWS }}
      TOQAN_DISRUPTIVE_TECH: ${{ secrets.TOQAN_DISRUPTIVE_TECH }}
      TOQAN_CHIPS_NEWS: ${{ secrets.TOQAN_CHIPS_NEWS }}
      TOQAN_GEOPOLITICS_NEWS: ${{ secrets.TOQAN_GEOPOLITICS_NEWS }}
      TOQAN_CLIMATE_NEWS: ${{ secrets.TOQAN_CLIMATE_NEWS }}
      TOQAN_BIOTECH_NEWS: ${{ secrets.TOQAN_BIOTECH_NEWS }}
      TOQAN_SOFTWARE_NEWS: ${{ secrets.TOQAN_SOFTWARE_NEWS }}
      TOQAN_FINTECH_NEWS: ${{ secrets.TOQAN_FINTECH_NEWS }}
      TOQAN_DEFENSE_NEWS: ${{ secrets.TOQAN_DEFENSE_NEWS }}
      TOQAN_MOT_LENS: ${{ secrets.TOQAN_MOT_LENS }}
      TOQAN_STRATEGIST: ${{ secrets.TOQAN_STRATEGIST }}
      ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
      # Falsifier Judge agent — ranks alert candidates; falsifier_run fail-opens without it.
      TOQAN_FALSIFIER_JUDGE: ${{ secrets.TOQAN_FALSIFIER_JUDGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Refresh every feed (each Feed in feeds.py with a key set above).
      - name: Refresh all feeds
        run: python backend/home_news_run.py

      # 2) Classify new rows with the MOT lens (idempotent; only NULL rows).
      #    Runs before analytics so the Strategist sees fresh classifications.
      - name: Classify with the MOT lens
        run: python backend/lens_run.py

      # 3) Rebuild the never-pruned rollup + regenerate the Strategist read.
      - name: Rebuild analytics (rollup + Strategist)
        run: python backend/analytics_run.py

      # Financials + forecasts moved to their own daily workflow
      # (.github/workflows/financials_forecasts.yml) — they don't need 6h freshness,
      # and splitting them lets their failures surface instead of being hidden by `|| true`.

      # 4) Push watchlist alerts (no-op if the watchlist is empty / no webhook).
      - name: Push watchlist alerts
        run: python backend/alerts_run.py

      # 5) Falsifier watch — scan fresh news for candidate evidence that an open
      #    Strategist falsifier triggered; alert on NEW events. Detection only
      #    (never resolves a forecast). Non-fatal: a failure here logs visibly
      #    but must not block the freshness check.
      - name: Falsifier watch
        run: python backend/falsifier_run.py
        continue-on-error: true

      # 6) Freshness check — alert (and fail the run) if any feed went stale or empty.
      #    Final step so it sees the result of this run.
      - name: Freshness check
        run: python backend/freshness_check.py
